<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 590" width="890" height="590" role="img" aria-label="Diagram: on server1, HTTP and HTTPS requests reach nginx-proxy, which forwards by VIRTUAL_HOST and only allows internal names from internal networks, via an allow list. acme-companion gets a certificate from Let's Encrypt for every VIRTUAL_HOST and hands them to nginx-proxy. nginx-proxy passes each request to a per-service reverse proxy, which sets VIRTUAL_HOST and LETSENCRYPT_EMAIL: the Immich and Nextcloud proxies serve internal names, and the Jellyfin proxy a public one. Jellyfin and Nextcloud run on server1; the Immich proxy reaches Immich on server2 over the lab network. fail2ban monitors the exposed services through their reverse proxies' logs and bans intrusion attempts." font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa8b8"/></marker><marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16BAC5"/></marker><marker id="deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker></defs><rect width="100%" height="100%" fill="#F8F8F8"/><rect x="358" y="12" width="160" height="40" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="438.0" y="37.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">HTTP/HTTPS</text><rect x="660" y="12" width="180" height="40" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="750.0" y="37.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Let's Encrypt</text><rect x="20" y="70" width="850" height="380" rx="10" fill="#eef2f7" stroke="#274C77" stroke-width="1.5"/><text x="36" y="92" text-anchor="start" font-size="15" fill="#274C77" font-weight="bold">server1 Docker containers</text><rect x="32" y="102" width="160" height="104" rx="8" fill="#ffffff" stroke="#16BAC5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="112.0" y="119.0" text-anchor="middle" font-size="16" fill="#16BAC5" font-weight="bold">Filters by origin</text><text x="112.0" y="139.0" text-anchor="middle" font-size="13.5" fill="#5a6472">*.internal names are</text><text x="112.0" y="159.0" text-anchor="middle" font-size="13.5" fill="#5a6472">only allowed on</text><text x="112.0" y="179.0" text-anchor="middle" font-size="13.5" fill="#5a6472">internal networks via</text><text x="112.0" y="199.0" text-anchor="middle" font-size="13.5" fill="#5a6472">an allow list</text><polyline points="192,154 296,154" fill="none" stroke="#16BAC5" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#acc)"/><polyline points="438,52 438,102" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><rect x="298" y="104" width="280" height="100" rx="8" fill="#ffffff" stroke="#274C77" stroke-width="1.5"/><text x="438.0" y="139.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">nginx-proxy</text><text x="438.0" y="159.0" text-anchor="middle" font-size="13.5" fill="#5a6472">forwards by VIRTUAL_HOST</text><text x="438.0" y="179.0" text-anchor="middle" font-size="13.5" fill="#5a6472">TLS for every name</text><rect x="640" y="104" width="220" height="100" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="750.0" y="139.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">acme-companion</text><text x="750.0" y="159.0" text-anchor="middle" font-size="13.5" fill="#5a6472">a certificate for</text><text x="750.0" y="179.0" text-anchor="middle" font-size="13.5" fill="#5a6472">every VIRTUAL_HOST</text><polyline points="750,104 750,54" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><polyline points="640,154 580,154" fill="none" stroke="#9aa8b8" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="610" y="146" text-anchor="middle" font-size="11" fill="#5a6472">certs</text><polyline points="438,204 438,212 284,212 592,212" fill="none" stroke="#9aa8b8" stroke-width="1.75"/><polyline points="284,212 284,242" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><polyline points="438,212 438,242" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><polyline points="592,212 592,242" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><rect x="206" y="226" width="464" height="110" rx="8" fill="none" stroke="#9aa8b8" stroke-width="1.25" stroke-dasharray="2 3"/><rect x="369.35" y="218" width="137.3" height="16" fill="#eef2f7"/><text x="438.0" y="230" text-anchor="middle" font-size="11" fill="#5a6472" font-family="monospace">nginx-reverse-proxy</text><rect x="214" y="244" width="140" height="84" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="284.0" y="281.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Immich proxy</text><text x="284.0" y="301.0" text-anchor="middle" font-size="13.5" fill="#5a6472">internal name</text><rect x="368" y="244" width="140" height="84" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="438.0" y="271.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Nextcloud proxy</text><text x="438.0" y="291.0" text-anchor="middle" font-size="13.5" fill="#5a6472">internal name</text><text x="438.0" y="311.0" text-anchor="middle" font-size="13.5" fill="#5a6472">allows huge uploads</text><rect x="522" y="244" width="140" height="84" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="592.0" y="281.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Jellyfin proxy</text><text x="592.0" y="301.0" text-anchor="middle" font-size="13.5" fill="#5a6472">public name</text><rect x="32" y="234" width="160" height="104" rx="8" fill="#ffffff" stroke="#c0504d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="112.0" y="251.0" text-anchor="middle" font-size="16" fill="#c0504d" font-weight="bold">fail2ban</text><text x="112.0" y="271.0" text-anchor="middle" font-size="13.5" fill="#5a6472">monitors exposed</text><text x="112.0" y="291.0" text-anchor="middle" font-size="13.5" fill="#5a6472">services through their</text><text x="112.0" y="311.0" text-anchor="middle" font-size="13.5" fill="#5a6472">proxies' logs, and bans</text><text x="112.0" y="331.0" text-anchor="middle" font-size="13.5" fill="#5a6472">intrusion attempts</text><polyline points="192,286 204,286" fill="none" stroke="#c0504d" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#deny)"/><rect x="692" y="244" width="160" height="84" rx="8" fill="#ffffff" stroke="#16BAC5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="772.0" y="261.0" text-anchor="middle" font-size="16" fill="#16BAC5" font-weight="bold">Parameters</text><text x="772.0" y="281.0" text-anchor="middle" font-size="13.5" fill="#5a6472">each proxy sets</text><text x="772.0" y="301.0" text-anchor="middle" font-size="13.5" fill="#5a6472">VIRTUAL_HOST and</text><text x="772.0" y="321.0" text-anchor="middle" font-size="13.5" fill="#5a6472">LETSENCRYPT_EMAIL</text><polyline points="692,286 672,286" fill="none" stroke="#16BAC5" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#acc)"/><polyline points="438,328 438,366" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><polyline points="592,328 592,366" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><rect x="368" y="368" width="140" height="60" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="438.0" y="393.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Nextcloud</text><text x="438.0" y="413.0" text-anchor="middle" font-size="13.5" fill="#5a6472">port 18080</text><rect x="522" y="368" width="140" height="60" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="592.0" y="393.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Jellyfin</text><text x="592.0" y="413.0" text-anchor="middle" font-size="13.5" fill="#5a6472">port 8096</text><rect x="20" y="470" width="850" height="104" rx="10" fill="#eef2f7" stroke="#274C77" stroke-width="1.5"/><text x="36" y="492" text-anchor="start" font-size="15" fill="#274C77" font-weight="bold">server2 Docker containers</text><polyline points="284,328 284,496" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><text x="296" y="352" text-anchor="start" font-size="12" fill="#5a6472">over the lab network</text><rect x="214" y="498" width="140" height="60" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="284.0" y="523.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Immich</text><text x="284.0" y="543.0" text-anchor="middle" font-size="13.5" fill="#5a6472">port 2283</text></svg>
