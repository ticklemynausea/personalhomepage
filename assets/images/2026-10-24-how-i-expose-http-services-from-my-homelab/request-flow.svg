<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 824" width="600" height="824" role="img" aria-label="Diagram: at home or on WireGuard, Pi-hole DNS resolves service names to the proxy's LAN address and the router only routes the traffic between VLANs. Elsewhere, public DNS gives the router's WAN address and the router forwards ports 80 and 443. Both reach nginx-proxy on server1, which runs a front-door allow list and returns 403 to outside sources for internal names. Public services under example.org are reachable from anywhere, and fail2ban monitors their access and bans intrusion attempts. Then a per-service reverse proxy, then the service, such as Jellyfin, Nextcloud or Immich." font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa8b8"/></marker><marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16BAC5"/></marker><marker id="deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker></defs><rect width="100%" height="100%" fill="#F8F8F8"/><rect x="30" y="20" width="240" height="52" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="150.0" y="51.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">At home, or on WireGuard</text><rect x="330" y="20" width="240" height="52" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="450.0" y="51.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Anywhere else</text><polyline points="150,72 150,106" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><polyline points="450,72 450,106" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><rect x="30" y="108" width="240" height="64" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="150.0" y="135.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Pi-hole DNS</text><text x="150.0" y="155.0" text-anchor="middle" font-size="13.5" fill="#5a6472">name → server1's LAN address</text><rect x="330" y="108" width="240" height="64" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="450.0" y="135.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Public DNS</text><text x="450.0" y="155.0" text-anchor="middle" font-size="13.5" fill="#5a6472">name → my router's WAN address</text><polyline points="450,172 450,206" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><rect x="330" y="208" width="240" height="64" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="450.0" y="235.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Router</text><text x="450.0" y="255.0" text-anchor="middle" font-size="13.5" fill="#5a6472">forwards 80/443 to server1</text><polyline points="150,172 150,306" fill="none" stroke="#16BAC5" stroke-width="1.75" marker-end="url(#acc)"/><text x="162" y="244" text-anchor="start" font-size="13" fill="#16BAC5">only routed</text><text x="162" y="262" text-anchor="start" font-size="13" fill="#16BAC5">between VLANs</text><polyline points="450,272 450,306" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><rect x="40" y="308" width="540" height="280" rx="10" fill="#eef2f7" stroke="#274C77" stroke-width="1.5"/><text x="60" y="334" text-anchor="start" font-size="16" fill="#274C77" font-weight="bold">nginx-proxy on server1</text><text x="60" y="354" text-anchor="start" font-size="13" fill="#5a6472">TLS with Let's Encrypt · forwards by VIRTUAL_HOST</text><rect x="60" y="372" width="360" height="92" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="240.0" y="403.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Front-door allow list</text><text x="240.0" y="423.0" text-anchor="middle" font-size="13.5" fill="#5a6472">*.internal.example.org?</text><text x="240.0" y="443.0" text-anchor="middle" font-size="13.5" fill="#5a6472">only from lan, lab, WireGuard</text><polyline points="420,418 452,418" fill="none" stroke="#c0504d" stroke-width="1.75" marker-end="url(#deny)"/><rect x="454" y="386" width="106" height="64" rx="8" fill="#ffffff" stroke="#c0504d" stroke-width="1.5"/><text x="507.0" y="413.0" text-anchor="middle" font-size="16" fill="#c0504d" font-weight="bold">403</text><text x="507.0" y="433.0" text-anchor="middle" font-size="13.5" fill="#5a6472">outside source</text><rect x="60" y="480" width="360" height="92" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="240.0" y="511.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Public services</text><text x="240.0" y="531.0" text-anchor="middle" font-size="13.5" fill="#5a6472">*.example.org</text><text x="240.0" y="551.0" text-anchor="middle" font-size="13.5" fill="#5a6472">access monitored by fail2ban</text><polyline points="454,526 422,526" fill="none" stroke="#c0504d" stroke-width="1.75" marker-end="url(#deny)"/><rect x="454" y="484" width="106" height="84" rx="8" fill="#ffffff" stroke="#c0504d" stroke-width="1.5"/><text x="507.0" y="511.0" text-anchor="middle" font-size="16" fill="#c0504d" font-weight="bold">fail2ban</text><text x="507.0" y="531.0" text-anchor="middle" font-size="13.5" fill="#5a6472">bans intrusion</text><text x="507.0" y="551.0" text-anchor="middle" font-size="13.5" fill="#5a6472">attempts</text><polyline points="240,588 240,630" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><rect x="60" y="632" width="360" height="64" rx="8" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/><text x="240.0" y="659.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">Per-service reverse proxy</text><text x="240.0" y="679.0" text-anchor="middle" font-size="13.5" fill="#5a6472">sets VIRTUAL_HOST · optional basic auth</text><polyline points="240,696 240,722" fill="none" stroke="#9aa8b8" stroke-width="1.75" marker-end="url(#arr)"/><rect x="60" y="724" width="360" height="80" rx="8" fill="#ffffff" stroke="#274C77" stroke-width="1.5"/><text x="240.0" y="751.0" text-anchor="middle" font-size="16" fill="#274C77" font-weight="bold">The service</text><text x="240.0" y="771.0" text-anchor="middle" font-size="13.5" fill="#5a6472">Jellyfin, Nextcloud, Immich, …</text><text x="240.0" y="791.0" text-anchor="middle" font-size="13.5" fill="#5a6472">on server1, server2, …</text></svg>
