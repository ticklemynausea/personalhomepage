server {
  real_ip_header X-Forwarded-For;
  set_real_ip_from 172.16.0.0/12;

  listen       80;
  server_name  localhost;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/xml application/atom+xml image/svg+xml text/plain;

  root /usr/share/nginx/html;

  # The stylesheet keeps the same URL across deploys, so only cache it briefly.
  location /assets/css/ {
    expires 1h;
  }

  location /assets/ {
    expires 30d;
  }

  location / {
    index  index.html index.htm;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}

# Redirect www.<domain> to <domain>. TLS ends at the front proxy, so always
# redirect to https.
server {
  listen       80;
  server_name  ~^www\.(?<domain>.+)$;

  return 301 https://$domain$request_uri;
}
